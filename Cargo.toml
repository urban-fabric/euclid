[package]
name = "euclid"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
rust-version = "1.95"
description = "Standard metric/unit primitives — speeds, lengths, times, angles, percentages, route weights, epoch timestamps, plus byte-size and count newtypes. Domain-agnostic; no kolmogorov coupling."
repository = "https://github.com/urban-fabric/euclid"

[dependencies]
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
self_named_module_files = "warn"
