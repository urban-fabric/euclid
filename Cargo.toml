[workspace]
resolver = "3"
members = [
    "crates/euclid-numeric",
    "crates/euclid-random",
    "crates/euclid-tensor",
    "crates/euclid-units",
]

# The euclid crates are dependency-free contracts crates: trait surfaces, f64/f32
# reference scalar implementations, integer/natural/bool carriers, and physical
# quantities. Nothing here pulls a third-party dependency; the only edges in the
# graph are the three leaf crates onto euclid-numeric.
#
#     euclid-numeric  (no dependencies)
#       ├── euclid-units
#       ├── euclid-tensor
#       └── euclid-random

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Raymond Mead"]
rust-version = "1.95"
repository = "https://github.com/urban-fabric/euclid"

[workspace.dependencies]
euclid-numeric = { version = "0.3.0", path = "crates/euclid-numeric" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
self_named_module_files = "deny"
