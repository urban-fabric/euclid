[package]
name = "euclid"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
rust-version = "1.95"
description = "Domain-neutral lazy numeric contracts: scalar algebra and analysis, interpolation, rank-graded array traits, random-source traits, and lazy physical quantities."
repository = "https://github.com/urban-fabric/euclid"

# euclid is the dependency-free foundations crate: lazy trait contracts, f64/f32
# reference scalar implementations, integer/natural/bool carriers, and lazy
# physical quantities.

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
self_named_module_files = "deny"
