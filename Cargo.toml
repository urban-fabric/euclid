[workspace]
resolver = "3"
members = [
    "crates/euclid-algebra",
    "crates/euclid-matrix",
    "crates/euclid-quantity",
    "crates/euclid-random",
    "crates/euclid-scalar",
    "crates/euclid-stability",
    "crates/euclid-tensor",
    "crates/euclid-units",
    "crates/euclid-utils",
]
# `matrix` and `tensor` are opt-in, and the opt-in is naming the crate.
#
# There is no `euclid` facade — see RELEASES.md 0.3.0, which removed one and said why: an umbrella
# is the reason `euclid-algebra` and `euclid-matrix` went stale in their own repositories. A cargo
# *feature* needs a crate to hang off, so "optional matrix and tensor" cannot mean a feature here;
# it means a consumer depends on `euclid-tensor` when it wants tensors and does not when it does
# not. That is a stronger guarantee than a default-off feature, because there is no manifest in
# which the dependency is present-but-inactive.
#
# These two are out of `default-members` so the bare commands skip them. Note the scope of that:
# `--workspace` overrides it, so all six checks in CONTRIBUTING.md still cover all nine members.
# It shortens the inner loop; it is not a coverage boundary.
default-members = [
    "crates/euclid-algebra",
    "crates/euclid-scalar",
    "crates/euclid-units",
    "crates/euclid-stability",
    "crates/euclid-random",
    "crates/euclid-quantity",
    "crates/euclid-utils",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Raymond Mead"]
rust-version = "1.95"
repository = "https://github.com/urban-fabric/euclid"

[workspace.dependencies]
euclid-algebra = { version = "0.6.0", path = "crates/euclid-algebra" }
euclid-scalar = { version = "0.6.0", path = "crates/euclid-scalar" }
euclid-units = { version = "0.6.0", path = "crates/euclid-units" }
euclid-tensor = { version = "0.6.0", path = "crates/euclid-tensor" }
euclid-utils = { version = "0.6.0", path = "crates/euclid-utils" }
euclid-stability = { version = "0.6.0", path = "crates/euclid-stability" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
mod_module_files = "deny"
