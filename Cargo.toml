[package]
name = "euclid"
version = "0.2.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
rust-version = "1.95"
description = "Dependency-free numeric contracts: scalar algebra and analysis, interpolation, rank-graded array traits, random-source traits, and physical quantities."
repository = "https://github.com/urban-fabric/euclid"

# euclid is a dependency-free contracts crate: trait surfaces, f64/f32 reference
# scalar implementations, integer/natural/bool carriers, and physical quantities.

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
self_named_module_files = "deny"
