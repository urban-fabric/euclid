[package]
name = "euclid-matrix"
# Apache-2.0, inherited from the workspace like every other member.
#
# This crate carried `license = "Proprietary"` and a comment arguing that "a move
# should not relicense code", on the reasoning that it predated the fold into
# euclid. That has been overridden deliberately by the copyright holder: the
# fleet ships under one licence, and a single member under different terms makes
# the whole workspace unpublishable as a set.
#
# `cargo deny check` is what surfaced it — "Proprietary" is not a valid SPDX
# expression, so the crate read as *unlicensed* rather than as restrictively
# licensed, which is a worse position than either.
license.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Backend-generic linear algebra traits and algorithms over euclid's rank-n Tensor contract, for eager and XLA backends."

[lib]
path = "src/lib.rs"

[features]
# The laws for the primitives below, shipped for a *backend* to run. Unlike every other
# conformance module in euclid this crate cannot execute them itself: the traits are
# backend primitives, so only a concrete tensor can satisfy them, and euclid ships none.
# Hence `feature` alone rather than `any(feature, test)` — there is no test here to serve.
conformance = []

[dependencies]
# euclid-matrix is *content*: it names the matrix extensions beyond the rank
# contract (`PreparedSpd`, `SpdFactor`, `TriangularSolve`, the decomposition
# traits) and the algorithms written once over them, and never touches a
# backend. A backend supplies the concrete tensor type these monomorphize on.
euclid-numeric.workspace = true
euclid-tensor.workspace = true

# Inherited, like every other member. The warn-level copy of this table that
# came over with the fold named the same lints one severity down, and euclid-matrix
# violates none of them, so inheriting costs nothing and stops the crate from
# silently drifting out of the workspace's standard.
[lints]
workspace = true
