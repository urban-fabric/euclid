[package]
name = "euclid-random"
description = "Explicit-key random sampler contracts: reproducible draws as a pure function of key, parameters, and shape."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[features]
# The key and sampler contracts, as functions a backend can check its impl against.
# Off by default; always compiled under `cfg(test)` so our own suites exercise the same
# code a consumer calls.
conformance = []

[dependencies]
euclid-numeric.workspace = true

[dev-dependencies]
# The property engine, for the generated companion to the fixed conformance suite. The
# derivation laws here are inequality claims about a mixing function, which is a large state
# space rather than a structural one — the case generated input is for.
euclid-property.workspace = true
euclid-utils.workspace = true

[lints]
workspace = true
