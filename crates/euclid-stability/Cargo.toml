[package]
name = "euclid-stability"
description = "Numerical stability and property testing: condition numbers, forward-error bounds, seam hunting, accuracy budgets, and randomized search with shrinking over a replayable choice tape. Dev-only."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
# Dev-only, like euclid-utils: a consumer takes this under [dev-dependencies] and it never
# reaches a published artifact. That is also why it is allowed to exist here at all — see the
# crate docs for why a test engine does not violate euclid's membership rule.
publish = false

[lints]
workspace = true

# A plain `fn main` rather than a bench harness: `#[bench]` is unstable and criterion is a
# third-party dependency the workspace does not take. See the file header for what it measures.
[[bench]]
name = "engine"
harness = false
