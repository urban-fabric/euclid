[package]
name = "euclid-tensor"
description = "Rank-graded array contracts: the Tensor trait, its opt-in capability extensions, and backend-neutral dtype/spec metadata."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[features]
# The structural half of the Tensor contract, as functions a backend can check against.
# Off by default; always compiled under `cfg(test)` so our own suites exercise the same
# code a consumer calls.
conformance = []

[dependencies]
euclid-numeric.workspace = true

[dev-dependencies]
# The property engine, for the generated companion to the fixed conformance suite. The fixed
# sample reaches every rank the laws need; generated shapes vary the extents, where a wrong
# permutation still produces the right shape.
euclid-property.workspace = true
euclid-utils.workspace = true

[lints]
workspace = true
