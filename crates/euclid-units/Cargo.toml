[package]
name = "euclid-units"
description = "Physical-dimension contracts over any euclid-numeric Real carrier: the seven SI base dimensions and the standard derived set, wired by their cross-dimensional algebra."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[features]
# The quantity contracts, as functions a carrier author can check their impl against.
# Off by default; always compiled under `cfg(test)` so our own suites exercise the same
# code a consumer calls.
conformance = []

[dependencies]
euclid-numeric.workspace = true

[dev-dependencies]
# The stability and property engine, for the generated conformance suite.
euclid-stability.workspace = true

[lints]
workspace = true
